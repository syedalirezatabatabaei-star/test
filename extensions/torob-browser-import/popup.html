<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خروجی ترب به Excel</title>
<style>
body{font:14px system-ui,sans-serif;min-width:360px;padding:12px;color:#202124}
h3{margin:0 0 12px}label{display:block;margin:9px 0}input{box-sizing:border-box;width:100%;margin-top:4px;padding:7px}
button{padding:9px 14px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
#status{white-space:pre-wrap;overflow-wrap:anywhere;padding:9px;background:#f3f4f6;border-radius:6px;min-height:28px}
#status[data-state="warning"]{background:#fff3cd;color:#664d03}
#status[data-state="error"]{background:#f8d7da;color:#842029}
small{display:block;color:#555;line-height:1.7;margin:8px 0}
</style>
</head>
<body>
<h3>ترب ← Excel</h3>
<label>آدرس n8n Webhook<input id="url" type="url" placeholder="https://..."></label>
<label>کلید ورود<input id="key" type="password" autocomplete="off"></label>
<label>عبارت جستجو<input id="query" type="text"></label>
<button id="go">بررسی و خروجی</button>
<small>فقط کارت‌های بارگذاری‌شده در تب فعال خوانده می‌شوند. اگر ترب CAPTCHA یا بررسی امنیتی نشان دهد، کار متوقف می‌شود؛ آن را دستی در همان تب تکمیل کن و دوباره دکمه را بزن. اکستنشن CAPTCHA را حل یا دور نمی‌زند.</small>
<pre id="status" aria-live="polite"></pre>
<script src="popup.js"></script>
</body>
</html>
